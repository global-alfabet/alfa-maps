# Netlify builds only the website. Connect the GitHub repo in Netlify and it deploys on every push to main.
[build]
  base = "apps/web"
  command = "npm ci && npm run lint && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
