<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alfa Maps · 3D sales platform for property developers</title>
    <meta name="description" content="Alfa Maps turns your layout plan into an interactive 3D estate. Buyers explore every plot, try house designs and see prices and payment plans on their phone." />
    <meta property="og:title" content="Alfa Maps · See the estate before it's built" />
    <meta property="og:description" content="Interactive 3D estate maps for property developers. A Global Alfabet product." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1D1D1F" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Lets Netlify Forms detect the contact form at build time -->
    <form name="contact" data-netlify="true" netlify-honeypot="company-website" hidden>
      <input name="name" /><input name="company" /><input name="email" /><input name="phone" /><textarea name="message"></textarea><input name="company-website" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
