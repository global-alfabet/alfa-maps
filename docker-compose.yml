# EstateMaps local stack.
#   docker compose up -d --build            → website (production build) on http://localhost:8081
#   docker compose --profile dev up         → website with live reload on http://localhost:5173
# The platform (API + admin + 3D viewer) will be added here as more services. See docs/ROADMAP.md.
services:
  web:
    build: ./apps/web
    image: estatemaps-web:latest
    container_name: estatemaps-web
    ports:
      - "${WEB_PORT:-8081}:80"
    restart: unless-stopped

  web-dev:
    profiles: ["dev"]
    image: node:20-slim
    container_name: estatemaps-web-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules

volumes:
  web-node-modules:
